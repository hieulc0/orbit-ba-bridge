[package]
name = "bridge-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
protocol = { version = "0.1.0", path = "../protocol" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
