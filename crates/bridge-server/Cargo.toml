[package]
name = "bridge-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "bridge_server"
path = "src/lib.rs"

[[bin]]
name = "bridge-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bridge-core = { version = "0.1.0", path = "../bridge-core" }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.26.0"
